server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas propias del dev server de Vite: no existen en producción.
    # Se cortan aquí además de en el proxy (defensa en profundidad).
    location ~ ^/(@fs|@vite|@id|@react-refresh|__vite|node_modules|src)(/|$) {
        return 404;
    }

    # Dotfiles (.env, .git, .ssh...)
    location ~ /\. {
        return 404;
    }

    # Assets con hash en el nombre: cacheables indefinidamente.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Fallback SPA para las rutas de react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
