events { worker_connections 1024; }

http {
  server_tokens off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # El bundle de producción no contiene scripts inline (Vite los extrae a
  # /assets/*.js), por eso script-src ya no necesita hash.
  # TECH DEBT: style-src mantiene 'unsafe-inline' porque la app React
  # inyecta estilos inline en runtime (style={{...}} en JSX).
  # Fix: migrar a estilos con nonce o hash y quitar 'unsafe-inline'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:8080; }

  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/spectra.ksabitova.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spectra.ksabitova.dev/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_tickets       off;

    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # ── Corte de rutas de dev server ──────────────────────────────────────
    # El frontend se sirve como estático; estas rutas solo existen si alguien
    # vuelve a arrancar `vite`/`npm run dev`. Se bloquean aquí para que un
    # despliegue mal hecho no reabra la lectura arbitraria de ficheros.
    # Las `location ~` tienen prioridad sobre los prefijos, así que esto
    # aplica antes que `location /`.
    location ~ ^/(@fs|@vite|@id|@react-refresh|__vite|__open-in-editor|node_modules|src)(/|$) {
      access_log /var/log/nginx/blocked.log;
      return 404;
    }

    # Dotfiles: /.env, /.git/..., /.ssh/..., etc.
    location ~ /\. {
      access_log /var/log/nginx/blocked.log;
      return 404;
    }

    # Ficheros de proyecto que nunca deben servirse.
    location ~* \.(env|ini|conf|bak|sql|db|log|pem|key|crt|tsx?|map)$ {
      access_log /var/log/nginx/blocked.log;
      return 404;
    }

    # `^~` impide que las location regex de arriba se evaluen sobre la API:
    # sin esto, un /api/.../algo.log lo cortaria el filtro de extensiones.
    location ^~ /api/ { proxy_pass http://backend; proxy_read_timeout 60s; }
    location = /health { proxy_pass http://backend/health; }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      # Sin cabeceras de Upgrade: ya no hay HMR/websocket contra el frontend.
      proxy_set_header Connection "";
    }
  }
}
